name: Update stable release index
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    concurrency:
      group: stable-release-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: ./.github/actions/update-release
        env:
          GH_TOKEN: ${{ github.token }}
