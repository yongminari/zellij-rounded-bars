name: Build, test, and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399
      - run: python tests/test_release_index.py
      - run: nix build
      - run: nix shell .#test-python .#zellij -c python tests/smoke.py result everforest-dark
      - run: nix shell .#test-python .#zellij -c python tests/smoke.py result everforest-light
      - run: nix shell .#test-python .#zellij -c python tests/smoke.py result everforest-dark --custom-bindings
      - name: Package
        run: |
          mkdir dist
          cp result/*.wasm dist/
          cd dist
          sha256sum -- *.wasm > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rounded-bars
          path: dist/*
  verify-artifact:
    name: Verify packaged release
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rounded-bars
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --strict -c SHA256SUMS
      - run: nix shell .#test-python .#zellij -c python tests/smoke.py dist everforest-dark
      - run: nix shell .#test-python .#zellij -c python tests/smoke.py dist everforest-light
      - run: nix shell .#test-python .#zellij -c python tests/smoke.py dist everforest-dark --custom-bindings
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-artifact
    concurrency:
      group: stable-release-index
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rounded-bars
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping creation and updating the stable release index."
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --notes "Rounded native tab and status bars for Zellij 0.45.1. See the README for installation and first-launch permissions."
          fi
      # GITHUB_TOKEN releases do not trigger the release event workflow.
      - uses: ./.github/actions/update-release
        env:
          GH_TOKEN: ${{ github.token }}
