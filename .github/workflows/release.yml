name: Build, test, and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399
      - run: nix build
      - run: nix shell .#test-python .#zellij -c python tests/smoke.py result everforest-dark
      - run: nix shell .#test-python .#zellij -c python tests/smoke.py result everforest-light
      - name: Package
        run: |
          mkdir dist
          cp result/*.wasm dist/
          cd dist
          sha256sum *.wasm > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rounded-bars
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rounded-bars
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --notes "Rounded native tab and status bars for Zellij 0.45.1. See the README for installation and first-launch permissions."
